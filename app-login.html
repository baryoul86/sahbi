<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Connexion – Sahbi</title>
<link rel="icon" href="/icons/icon-192.png">
<style>
:root{--bg:#FFFFFF;--fg:#0F2E24;--muted:#4D675C;--btn:#2FAE74;--ink:#0B2219;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0B1F18;--fg:#E8F5EE;--muted:#9CB8AB;--btn:#3CC587;--ink:#062016}}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px 16px;box-sizing:border-box}
img{width:72px;height:72px;border-radius:18px}
a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--btn);color:var(--ink);text-decoration:none;font-weight:600;margin-top:12px}
p{color:var(--muted);max-width:420px;margin:12px auto}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1 id="t">Ouverture de Sahbi…</h1>
  <p id="m">Si l'application ne s'ouvre pas toute seule, appuie sur le bouton.</p>
  <a class="btn" id="open" href="bond.sahbi.app://auth">Ouvrir l'app Sahbi</a>
  <p><a href="/" style="color:inherit">Continuer sur le site</a></p>
</main>
<script>
// Il link dell'e-mail (accesso dall'app iPhone) arriva qui con i dati di connessione:
// li passiamo all'app Sahbi con il link bond.sahbi.app://auth (niente viene salvato su questa pagina).
(function () {
  var extra = (location.search.length > 1 ? location.search.slice(1) : '') + (location.hash.length > 1 ? (location.search.length > 1 ? '&' : '') + location.hash.slice(1) : '');
  var link = 'bond.sahbi.app://auth' + (extra ? '#' + extra : '');
  document.getElementById('open').href = link;
  if (/error_description=/.test(extra)) {
    document.getElementById('t').textContent = 'Lien expiré';
    document.getElementById('m').textContent = 'Ce lien a expiré ou a déjà été utilisé. Retourne dans l’app Sahbi et demande un nouveau lien.';
  }
  if (extra) { history.replaceState(null, '', location.pathname); location.href = link; }
})();
</script>
</body>
</html>
