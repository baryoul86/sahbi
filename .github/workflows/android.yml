name: App Android (Google Play)

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Costruisci l'app
        env:
          KEY_PASSWORD: ${{ secrets.SAHBI_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.run_number }}
        run: |
          set -o pipefail
          bash android/build.sh 2>&1 | tee build.log

      - name: File dell'app (.aab per Google Play, .apk per provare)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sahbi-android-${{ github.run_number }}
          path: out/

      # Il risultato (log e impronta della chiave, niente di segreto) va nel ramo "android-build".
      - name: Rapporto
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tmp="$(mktemp -d)"
          tail -n 200 build.log > "$tmp/build.log" 2>/dev/null || echo "nessun log" > "$tmp/build.log"
          cp out/sha256.txt "$tmp/" 2>/dev/null || true
          echo "run ${{ github.run_number }} – ${{ job.status }} – $(date -u)" > "$tmp/STATO.txt"
          cd "$tmp" && git init -q && git checkout -q -b android-build && git add . \
            && git -c user.name="sahbi-bot" -c user.email="bot@sahbi.bond" commit -qm "Rapporto ${{ github.run_number }}" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" android-build
