# Construit l'app iPhone de Sahbi sur un Mac de GitHub et l'envoie à App Store Connect (TestFlight).
name: iPhone – construire et envoyer
on: workflow_dispatch
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Xcode le plus récent
        run: X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1); sudo xcode-select -s "$X"; xcodebuild -version
      - name: Projet iOS (Capacitor)
        working-directory: ios-app
        run: |
          npm install --no-audit --no-fund
          npx cap add ios
          npx capacitor-assets generate --ios || echo "::warning::icônes non générées"
          bash ../ios-ci/plist.sh
          npx cap sync ios
      - name: Équipe Apple et réglages
        working-directory: ios-app
        run: |
          pip3 install --break-system-packages -q pyjwt cryptography requests
          TEAM=$(cd ../ios-ci && python3 team.py); echo "TEAM=$TEAM" >> $GITHUB_ENV
          sudo gem install xcodeproj --no-document -q
          TEAM=$TEAM MV=1.0 BN=$GITHUB_RUN_NUMBER ruby ../ios-ci/patch.rb
          mkdir -p ~/private_keys; printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Certificat et profil
        run: cd ios-ci && python3 sign.py
      - name: Compiler (archive)
        working-directory: ios-app
        run: |
          set -o pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive archive \
            | grep -E "error|warning: .*sign|ARCHIVE|BUILD" | tail -60
      - name: Envoyer à App Store Connect
        run: |
          set -o pipefail
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>destination</key><string>upload</string>
          <key>teamID</key><string>$TEAM</string>
          <key>signingStyle</key><string>manual</string>
          <key>signingCertificate</key><string>Apple Distribution</string>
          <key>provisioningProfiles</key><dict><key>bond.sahbi.app</key><string>Sahbi AppStore CI</string></dict>
          <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PL
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_$ASC_KEY_ID.p8 \
            -authenticationKeyID $ASC_KEY_ID -authenticationKeyIssuerID $ASC_ISSUER_ID | tail -40
          echo "::notice title=iPhone::build $GITHUB_RUN_NUMBER envoyée à App Store Connect (TestFlight dans 10-30 min)"
      - name: Nettoyage
        if: always()
        run: rm -rf ~/private_keys "$RUNNER_TEMP"/*.p12; security delete-keychain "$RUNNER_TEMP/ci.keychain-db" 2>/dev/null || true
