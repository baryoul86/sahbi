name: iPhone – rimandare ad Apple
on:
  workflow_dispatch:
    inputs:
      mode:
        description: prepare (bozza) o submit (invio)
        default: prepare
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pyjwt cryptography requests
      - working-directory: ios-ci
        run: python resubmit.py
        env:
          MODE: ${{ inputs.mode }}
          ASC_KEY_ID: MB5LDSL2XR
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
