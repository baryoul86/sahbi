name: Test Sahbi

# A ogni aggiornamento: prova chat, immagini, foto, lingue, voce, meteo, pagamenti e admin
# con OpenAI/Supabase finti. Se qualcosa si rompe, il controllo diventa rosso e GitHub manda un'e-mail.
on:
  push:
    branches: [main]
    paths: ['api/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/run.mjs
